# Netlify : site statique, rien à compiler.
# La commande ci-dessous remplace celle saisie dans l'interface Netlify (ex. "Hugo").
[build]
  command = "echo 'Site statique - pas de build'"
  publish = "."

# Toujours servir la dernière version des données
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"
