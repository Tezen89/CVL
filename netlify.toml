# Netlify : site statique, rien à compiler.
# Le site a été créé avec un réglage "Hugo" qui impose le dossier "public" :
# on copie donc les fichiers utiles de l'app dans "public" et on publie ce dossier.
# (Bonus : l'Excel et les scripts Python ne sont pas mis en ligne.)
[build]
  command = "rm -rf public && mkdir public && cp -r index.html manifest.json data.json config.json assets public/"
  publish = "public"

# Toujours servir la dernière version des données
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"
